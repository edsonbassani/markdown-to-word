name: Release - Publish to NuGet

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/global.json

      - name: Ensure Playwright CLI on PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore MarkdownToWord.sln

      - name: Install Playwright (Chromium)
        run: |
          dotnet tool update --global Microsoft.Playwright.CLI
          playwright install --with-deps chromium

      - name: Build
        run: dotnet build MarkdownToWord.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MarkdownToWord.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults --collect:"XPlat Code Coverage"

      - name: Pack
        run: dotnet pack src/MarkdownToWord/md2word.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ github.run_id }}
          path: artifacts/*.nupkg
          retention-days: 7

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
